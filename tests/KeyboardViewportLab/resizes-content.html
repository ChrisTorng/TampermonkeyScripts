<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>軟鍵盤定位測試 2026-11-26 v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font:16px system-ui,sans-serif;background:#eadcfb;color:#18202a}body{overflow:hidden}
header{position:fixed;top:0;left:0;right:0;padding:8px;background:#fff;z-index:3;border-bottom:1px solid #bbb;font-size:13px;overflow:auto}
h1{font-size:16px;margin:0 0 5px}button{font:inherit;padding:6px 8px;margin:2px;border:1px solid #889;border-radius:5px;background:#eee;color:#18202a;touch-action:manipulation}
button[aria-pressed=true]{background:#164f80;color:white}
#messages{position:fixed;left:0;right:0;top:0;bottom:0;overflow:auto;padding:180px 10px 170px}
#messages p{background:white;padding:10px;border-radius:6px;margin:8px 0}
#composer{position:fixed;left:0;right:0;bottom:8px;padding:8px 8px 8px 8px;background:#dcefe6;border:2px solid #16805b;z-index:2}
textarea{display:block;width:100%;resize:none;font:16px system-ui;min-height:36px;max-height:100px;padding:5px;border:1px solid #888;border-radius:4px}
#gap{font-size:12px;font-weight:bold}#probe{position:fixed;bottom:0;left:0;width:1px;height:1px;pointer-events:none;visibility:hidden}
#marker{position:fixed;bottom:0;right:0;width:25%;height:4px;background:#e29b12;z-index:4;pointer-events:none}
#log{font:10px/1.3 monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#374151;background:white;padding:6px}
#status{font:12px/1.3 monospace;white-space:pre-wrap;margin:3px 0}
</style>
</head>
<body>
<header id="head"><h1>鍵盤定位測試 v3：resizes-content</h1>
<div id="modes"><button data-mode="native" aria-pressed="true">A 原生</button><button data-mode="legacy" aria-pressed="false">B 舊補償</button><button data-mode="measured" aria-pressed="false">C 實測補償</button></div>
<div id="status" aria-live="off"></div>
<button id="capture">記錄（不關鍵盤）</button><button id="copy">複製紀錄</button>
</header>
<main id="messages"><p>只測 A 原生模式。點底部輸入框開啟鍵盤，等 1 秒，觀察黃色線與鍵盤上緣間是否仍有空白，再按原本回報鈕兩次。</p><p>輸入幾行測試文字即可，不會收集輸入內容。黃色短線表示原生 fixed bottom:0 的位置。</p><p>不必切換模式或按記錄。請保持鍵盤開啟，按原本回報鈕兩次。淡紫色底用來辨別空白區是否跟隨網頁背景。</p><p>記錄保留鍵盤開啟時的尺寸，即使回報時鍵盤已關閉也不會遺失。</p><pre id="log" translate="no"></pre></main>
<section id="composer"><div id="gap">輸入框</div><textarea id="editor" rows="1" placeholder="點此開啟鍵盤，可輸入多行"></textarea></section>
<div id="probe"></div><div id="marker"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const vv=window.visualViewport, composer=$('composer'), probe=$('probe'), editor=$('editor'), log=$('log');
let mode='native', history=[], raf=0, timers=[], lastSignature='', lastCapture='', baseline=null, captures={};
const round=n=>Math.round(n*10)/10;
function geometry(){
 const h=vv?.height??innerHeight, y=vv?.offsetTop??0;
 return {innerH:innerHeight,clientH:document.documentElement.clientHeight,vvH:h,vvTop:y,vvBottom:y+h,scale:vv?.scale??1,probeBottom:probe.getBoundingClientRect().bottom};
}
function update(reason,force=false){
 const g=geometry();
 // Native fixed probe measures the actual coordinate origin instead of assuming
 // window.innerHeight is the fixed containing-block height.
 const legacy=g.innerH-g.vvBottom+8;
 const measured=g.probeBottom-g.vvBottom+8;
 const focused=document.activeElement===editor;
 const bottom=mode==='native'?8:mode==='legacy'?legacy:(Math.abs(g.scale-1)<.05?measured:8);
 composer.style.bottom=bottom+'px';
 const r=composer.getBoundingClientRect();
 const row={t:Math.round(performance.now()),reason,mode,focused,innerH:round(g.innerH),clientH:round(g.clientH),vvH:round(g.vvH),vvTop:round(g.vvTop),vvBottom:round(g.vvBottom),scale:round(g.scale),probe:round(g.probeBottom),legacy:round(legacy),measured:round(measured),applied:round(bottom),composerTop:round(r.top),composerBottom:round(r.bottom),gap:round(g.vvBottom-r.bottom),scrollY:round(scrollY),reportBottom:null,reportCssBottom:null};
 const report=document.querySelector('#tm-webdiag-toggle');
 if(report){row.reportBottom=round(report.getBoundingClientRect().bottom);row.reportGap=round(g.vvBottom-report.getBoundingClientRect().bottom);row.reportCssBottom=getComputedStyle(report.parentElement).bottom}
 if(!focused && !baseline)baseline={innerH:row.innerH,vvH:row.vvH};
 $('head').style.top=g.vvTop+'px';
 $('head').style.maxHeight=Math.max(80,g.vvH-70)+'px';
 $('status').textContent='gap '+row.gap+'px / 目標 8px | '+(focused?'輸入中':'未輸入')+'\ninner '+row.innerH+' / vv '+row.vvH+' / top '+row.vvTop+' / fixed '+row.probe;
 $('gap').textContent='輸入框 '+mode+' · 間距 '+row.gap+'px';
 const signature=JSON.stringify({...row,t:0,reason:''});
 if(reason==='manual-capture')captures[mode]=row;
 if(force||signature!==lastSignature){lastSignature=signature;history.push(row);if(history.length>60)history.shift();render()}
}
function render(){
 const payload=JSON.stringify({version:3,viewportMode:"resizes-content",baseline,lastCapture,captures,history},null,0);
 // Both a public-text report and a direct copy can retrieve the numeric history.
 log.textContent=payload;log.dataset.keyboardGeometry=payload;
}
function schedule(reason){
 if(raf)cancelAnimationFrame(raf);
 raf=requestAnimationFrame(()=>{raf=0;update(reason)});
 for(const t of timers)clearTimeout(t);
 timers=[350,1000].map(ms=>setTimeout(()=>update(reason+'+'+ms,true),ms));
}
function preserve(button){button.addEventListener('pointerdown',e=>e.preventDefault());button.addEventListener('mousedown',e=>e.preventDefault())}
for(const b of document.querySelectorAll('button'))preserve(b);
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{
 mode=b.dataset.mode;
 for(const c of document.querySelectorAll('[data-mode]'))c.setAttribute('aria-pressed',String(c===b));
 update('mode:'+mode,true);schedule('mode-settled');
});
$('capture').addEventListener('click',()=>{lastCapture=mode;update('manual-capture',true);$('capture').textContent='已記錄 '+mode;});
$('copy').addEventListener('click',async()=>{update('copy',true);try{await navigator.clipboard.writeText(log.textContent);$('copy').textContent='已複製'}catch{ $('copy').textContent='複製失敗，請使用回報鈕'; }});
editor.addEventListener('input',()=>{editor.style.height='auto';editor.style.height=Math.min(100,Math.max(36,editor.scrollHeight+2))+'px';schedule('input')});
for(const event of ['focusin','focusout'])document.addEventListener(event,()=>schedule(event));
for(const event of ['resize','scroll'])vv?.addEventListener(event,()=>schedule('vv.'+event));
window.addEventListener('resize',()=>schedule('window.resize'));
window.addEventListener('orientationchange',()=>schedule('orientation'));
window.addEventListener('load',()=>schedule('load'));
update('initial',true);
</script>
</body></html>
