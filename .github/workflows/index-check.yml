name: Generate index

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify math translation strategy lab in headless Chrome
        run: node --test scripts/test-math-translation-strategies.js
      - name: Test Hacker News article navigation and read states
        run: node --test scripts/test-auto-open-new-articles.js
      - name: Test Reddit redirect behavior
        run: node --test scripts/test-redirect-urls.js
      - name: Test content controls and real browser clipping
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-transient-controls.js scripts/test-control-browser.js
      - name: Generate documentation pages
        run: npm run generate:index
      - name: Verify HTML outputs were produced
        run: test -f index.html && test -f TestCases.html && test -f CurrentUpdates.html
