name: Generate index

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject userscript content changes without a version bump
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: node --test scripts/test-userscript-version-bumps.js
      - name: Verify math translation strategy lab in headless Chrome
        run: node --test scripts/test-math-translation-strategies.js
      - name: Test other-site article discovery and auto-open
        run: node --test scripts/test-auto-open-new-articles.js
      - name: Test mobile readability and Hacker News comment-only auto-enlargement
        run: node --test scripts/test-force-mobile-view.js
      - name: Test Archive Today and Wayback redirect ownership
        run: npm run test:archive-redirects
      - name: Test Reddit redirect behavior
        run: node --test scripts/test-redirect-urls.js
      - name: Test Reddit app popup suppression
        run: node --test scripts/test-reddit-hide-app-popup.js
      - name: Test Better Discord keyboard layout
        run: node --test scripts/test-better-discord.js
      - name: Test YouTube speed controls and Android Edge fullscreen zoom
        run: node --test scripts/test-youtube-tools.js
      - name: Test generic fullscreen orientation and embedded player handoff
        run: node --test scripts/test-fullscreen-game-view.js
      - name: Test scroll marker clipping and hidden container visibility
        run: node --test scripts/test-responsive-scroll-indicator.js
      - name: Test rendered scroll marker visibility in Chromium
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-scroll-paint-browser.js
      - name: Test outer scroll marker flush-edge anchoring and scroll sources
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-root-scroll-browser.js
      - name: Test preformatted translation layout in Chromium
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-github-translation-browser.js scripts/test-formatted-translation-browser.js
      - name: Test shared menu, safe translation and GM update tabs
        run: node --test scripts/test-floating-menu.js scripts/test-translate-preformatted-text.js scripts/test-bulk-update-gm.js
      - name: Test opt-in native translation diagnostics
        run: node --test scripts/test-translation-diagnostics.js
      - name: Test generic iframe translation reader and dragging
        run: node --test scripts/test-iframe-translate-open.js
      - name: Test content controls and real browser clipping
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-transient-controls.js scripts/test-control-browser.js
      - name: Test five update tabs launcher in Chromium
        env:
          CONTROL_BROWSER_BIN: google-chrome
        run: node --test scripts/test-update-tabs-browser.js
      - name: Verify one-install bundle exactly matches the five standalone sources
        run: node scripts/build-shared-menu-all-in-one.js --check
      - name: Test generated bundle version, metadata and host routing
        run: node --test scripts/test-shared-menu-all-in-one.js
      - name: Generate documentation pages
        run: npm run generate:index
      - name: Verify HTML outputs were produced
        run: test -f index.html && test -f TestCases.html && test -f CurrentUpdates.html
